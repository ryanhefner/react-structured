  - '@chakra-docs/chakra@0.3.0'
  - '@chakra-docs/core@0.3.0'
  - '@chakra-docs/next@0.3.0'
  - '@chakra-docs/search@0.3.0'
  - '@chakra-docs/shiki@0.3.0'
  - '@chakra-docs/source-filesystem@0.3.0'
